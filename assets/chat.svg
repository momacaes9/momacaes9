ics + Data Science @ UNC Chapel Hill &#x27;30 · from São Paulo, Brazil</text></g><g class="typing" style="animation-delay:2.20s"><rect x="24" y="124" width="58" height="33" rx="16.5" fill="#2A3550"/><circle cx="41" cy="140.5" r="3.4" fill="#8FA3BF"/><circle cx="53" cy="140.5" r="3.4" fill="#8FA3BF"/><circle cx="65" cy="140.5" r="3.4" fill="#8FA3BF"/></g><g class="msg" style="animation-delay:2.70s"><rect x="24.0" y="124" width="650.2" height="33" rx="16.5" fill="#2A3550"/><text x="38.0" y="145.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E6EDF7">I build with data and AI: RL datasets for AI@UNC, iOS apps, maps and chatbots</text></g><g class="typing" style="animation-delay:3.10s"><rect x="24" y="167" width="58" height="33" rx="16.5" fill="#2A3550"/><circle cx="41" cy="183.5" r="3.4" fill="#8FA3BF"/><circle cx="53" cy="183.5" r="3.4" fill="#8FA3BF"/><circle cx="65" cy="183.5" r="3.4" fill="#8FA3BF"/></g><g class="msg" style="animation-delay:3.60s"><rect x="24.0" y="167" width="645.1" height="33" rx="16.5" fill="#2A3550"/><text x="38.0" y="188.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E6EDF7">Fed Challenge investment researcher · founder of OSDA · co-founder of ViaMundi</text></g><g class="msg" style="animation-delay:4.00s"><rect x="530.2" y="210" width="305.8" height="33" rx="16.5" fill="#4B9CD3"/><text x="544.2" y="231.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#FFFFFF">what are you working on right now?</text></g><g class="typing" style="animation-delay:4.40s"><rect x="24" y="253" width="58" height="33" rx="16.5" fill="#2A3550"/><circle cx="41" cy="269.5" r="3.4" fill="#8FA3BF"/><circle cx="53" cy="269.5" r="3.4" fill="#8FA3BF"/><circle cx="65" cy="269.5" r="3.4" fill="#8FA3BF"/></g><g class="msg" style="animation-delay:4.90s"><rect x="24.0" y="253" width="658.5" height="